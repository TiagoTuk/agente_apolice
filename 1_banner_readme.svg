<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Agente de IA para Extração de Dados de Apólices</title>
<desc>Banner ilustrativo mostrando um fluxo de documentos PDF sendo processados por IA e transformados em uma planilha de dados</desc>

<rect width="1200" height="300" fill="#0F1720"/>

<!-- Padrão sutil de grade de fundo -->
<g opacity="0.08">
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200" stroke="#5A7A9A" stroke-width="1"/>
  <path d="M150 0 V300 M400 0 V300 M650 0 V300 M900 0 V300 M1050 0 V300" stroke="#5A7A9A" stroke-width="1"/>
</g>

<!-- Documentos PDF (esquerda) -->
<g transform="translate(90, 95)">
  <rect x="10" y="10" width="78" height="100" rx="6" fill="#1D2733" stroke="#3A4B5C" stroke-width="1.5"/>
  <rect x="0" y="0" width="78" height="100" rx="6" fill="#243040" stroke="#4A6076" stroke-width="1.5"/>
  <rect x="16" y="20" width="46" height="5" rx="2" fill="#5DCAA5"/>
  <rect x="16" y="32" width="46" height="4" rx="2" fill="#5A7A9A"/>
  <rect x="16" y="42" width="34" height="4" rx="2" fill="#5A7A9A"/>
  <rect x="16" y="58" width="46" height="4" rx="2" fill="#5A7A9A"/>
  <rect x="16" y="68" width="30" height="4" rx="2" fill="#5A7A9A"/>
  <text x="39" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#5DCAA5">PDF</text>
</g>

<!-- Seta 1 -->
<path d="M195 150 L250 150" stroke="#4A6076" stroke-width="2" fill="none" marker-end="url(#arrow1)"/>
<defs>
  <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#4A6076" stroke-width="1.5"/>
  </marker>
</defs>

<!-- Nó central de IA -->
<g transform="translate(320, 100)">
  <circle cx="50" cy="50" r="62" fill="#1D2733" stroke="#7F77DD" stroke-width="2"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#534AB7" stroke-width="1" opacity="0.5"/>
  <circle cx="50" cy="30" r="5" fill="#AFA9EC"/>
  <circle cx="30" cy="55" r="5" fill="#AFA9EC"/>
  <circle cx="70" cy="55" r="5" fill="#AFA9EC"/>
  <circle cx="50" cy="72" r="5" fill="#AFA9EC"/>
  <path d="M50 30 L30 55 M50 30 L70 55 M30 55 L50 72 M70 55 L50 72 M30 55 L70 55" stroke="#7F77DD" stroke-width="1.2" opacity="0.7"/>
</g>
<text x="370" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9B9BC4">IA local (Ollama)</text>

<!-- Seta 2 -->
<path d="M470 150 L525 150" stroke="#4A6076" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#4A6076" stroke-width="1.5"/>
  </marker>
</defs>

<!-- Planilha Excel (direita) -->
<g transform="translate(560, 90)">
  <rect x="0" y="0" width="130" height="120" rx="6" fill="#1A3A2E" stroke="#3D9E75" stroke-width="1.5"/>
  <line x1="0" y1="28" x2="130" y2="28" stroke="#3D9E75" stroke-width="1"/>
  <line x1="43" y1="28" x2="43" y2="120" stroke="#2A5A46" stroke-width="1"/>
  <line x1="86" y1="28" x2="86" y2="120" stroke="#2A5A46" stroke-width="1"/>
  <line x1="0" y1="55" x2="130" y2="55" stroke="#2A5A46" stroke-width="1"/>
  <line x1="0" y1="80" x2="130" y2="80" stroke="#2A5A46" stroke-width="1"/>
  <line x1="0" y1="100" x2="130" y2="100" stroke="#2A5A46" stroke-width="1"/>
  <rect x="8" y="10" width="30" height="8" rx="2" fill="#5DCAA5"/>
  <rect x="51" y="10" width="30" height="8" rx="2" fill="#5DCAA5"/>
  <rect x="94" y="10" width="28" height="8" rx="2" fill="#5DCAA5"/>
</g>
<text x="625" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8FD4B5">Relatório Excel</text>

<!-- Texto principal -->
<g transform="translate(760, 0)">
  <text x="0" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F5F8">Agente de IA para</text>
  <text x="0" y="158" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F5F8">Extração de Dados</text>
  <text x="0" y="196" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F5F8">de Apólices</text>
  <rect x="0" y="215" width="330" height="2" fill="#3A4B5C"/>
  <text x="0" y="248" font-family="Arial, sans-serif" font-size="15" fill="#9AAAB8">Automação documental com regex + LLM local</text>
</g>

</svg>
